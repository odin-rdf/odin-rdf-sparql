# Same shape as the store's workflow, with two more sibling checkouts: this
# project reaches the parser, the store and the record store through
# collections, and a collection resolves in the importing compilation, so their
# own `rdf:` imports need the parser present here too.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # sparql/kvstore compiles the store's LMDB backend into its own
    # binaries, so this repo runs wherever the store has a vendored LMDB
    # archive -- which, since the archives were built out, is everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: odin-rdf-sparql

      # All three are pinned to released tags rather than tracking main, matching
      # odin-rdf-shacl's workflow. Until SPARQL-T-0023 this job checked out
      # whatever was on the upstream default branches, which meant an unrelated
      # upstream commit could turn this repository's CI red and there was no way
      # to tell a local regression from an inherited one. A pin makes an upstream
      # move a deliberate bump here, and a red build then means this repository
      # broke.
      #
      # **odin-rdf-store v0.3.0 is a floor, not just a pin**, for three reasons,
      # each strictly above the last. `v0.1.0` vendored exactly one LMDB archive
      # — `liblmdb_darwin_arm64.a` — and `sparql/kvstore` links those archives,
      # so against that tag this builds on macOS and fails to link on the ubuntu
      # and windows runners above; STORE-A-0004's five-platform vendoring is what
      # `v0.1.1` released. Above that, `v0.2.0` is the release that retired
      # `store/memstore` (STORE-A-0006), and since SPARQL-T-0023 this repository
      # has no memstore instantiation to build against an earlier store. Above
      # that again, SPARQL-T-0024 made a query one snapshot: `txn_begin`,
      # `match_txn`, `find_term_txn` and `lookup_term_txn` do not exist before
      # `v0.3.0` (STORE-A-0007). Do not pin below it.
      #
      # **`v0.5.0` is a floor too, and the newest one** (SPARQL-T-0025).
      # `as_of_test.odin` calls `kvstore.txn_begin_as_of` and `kvstore.remove`,
      # neither of which exists before it (STORE-A-0008), so this cannot pin
      # below `v0.5.0` while that test is in the suite. Note also that `v0.5.0`
      # is a **format** break: a database written by an earlier store will not
      # open, which costs this repository nothing because every store it makes
      # is ephemeral, but it is the reason the bump is a minor rather than a
      # patch.
      #
      # **`v0.6.0` is the pin and is *not* a floor** — the distinction matters
      # here, because everything above this line is a floor and this is not.
      # Nothing in this repository needs `v0.6.0` to compile: it is purely
      # additive over `v0.5.0` (`estimate`, `match_order`/`match_orderable`/
      # `match_ordered`, `store.NAMED_GRAPHS`, `graphs`/`nodes`), the format
      # version is unchanged at 2, and no signature moved. The pin is here so
      # that this repository is what proves the store's release safe for its
      # consumers, which is the only thing that can — the store's own CI cannot
      # tell whether a capability it added broke somebody downstream.
      #
      # It becomes a floor the moment SPARQL-T-0026, -0028 or -0029 lands, each
      # of which names something that does not exist before `v0.6.0`. Until
      # then, dropping back to `v0.5.0` would still build; it would simply stop
      # testing the thing this pin exists to test.
      #
      # The prior pin's reasoning is kept because it is still true and still
      # load-bearing: `v0.4.0` retries `open_ephemeral`'s reservation, which
      # this repository leans on harder than any other in the family — roughly
      # 966 ephemeral opens, two per evaluation entry. odin-rdf-shacl's Windows
      # job failed intermittently on ~58 of them (STORE-T-0042) before that fix,
      # so this one is exposed to the same transient and must stay above it.
      #
      # To bump any of them: change the ref, run `make test` and `make check`
      # locally against the new checkout, and commit them together — a collection
      # is resolved in the *importing* compilation, so the store's and the record
      # store's sources are built against whichever parser this file names, and
      # moving one without the other is how two versions of the data model end up
      # in one binary.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-parser
          ref: v0.1.0
          path: odin-rdf-parser

      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-store
          ref: v0.6.0
          path: odin-rdf-store

      # **odin-rdf-record `v0.4.0` is a floor, and it is the only pin here
      # that was cut *for* this repository** (SPARQL-T-0030). The port off
      # odin-rdf-store onto the record store is SPARQL-I-0003; this checkout
      # arrives before anything store-side is deleted, so for the length of
      # that initiative all three siblings are present at once and `store:`
      # above is still load-bearing.
      #
      # The floor is `v0.4.0` and not `v0.3.0`, which is what SPARQL-T-0030
      # was filed asking for, because the gate this port was blocked on landed
      # in between. `v0.3.0` is a floor in its own right for odin-rdf-shacl —
      # `v0.2.0` for `ingest` emitting a document's *set* (RECORD-T-0019),
      # `v0.3.0` for the distinct `Term_ID`/`Fact_ID`/`Epoch` types
      # (RECORD-T-0020), without which an engine holding raw `u32` ids does
      # not compile. Above both, `v0.4.0` is RECORD-I-0004: RDF 1.2 triple
      # terms and base-direction literals, which `apply` refused outright
      # before it. `tests/smoke` names `snapshot_triple_parts`,
      # `Term_Kind.Triple` and `snapshot_term_destroy`, none of which exist
      # below `v0.4.0`, so this cannot pin lower while that package is in the
      # suite — and the 38 evaluated entries of `sparql12-eval-triple-terms`
      # are unreachable below it in any case (SPARQL-I-0003 §6).
      #
      # `v0.4.0` is also a **format** break: format version 2 does not read a
      # version 1 log and refuses with `.Bad_Version`. That costs this
      # repository nothing — every store the suite makes is fresh over
      # `Mem_FS` — but it is the reason the bump is a minor rather than a
      # patch, the same reasoning as odin-rdf-store's `v0.5.0` above.
      #
      # No `python3` step is needed: the cross-implementation verifier is
      # record's own test-suite dependency, not a consumer's. The Windows
      # runner compiles record without its POSIX `File_Ops` — that file is
      # `#+build linux, darwin` — which works only for as long as nothing
      # here names `posix_file_ops`. `tests/smoke` opens over `mem_file_ops`,
      # which is platform-free, and every ported harness call site must do
      # the same.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-record
          ref: v0.4.0
          path: odin-rdf-record

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Odin version
        run: odin version

      - name: Vet every package
        working-directory: odin-rdf-sparql
        run: make check

      # The W3C suites dominate this one: 352 syntax and 483 evaluation
      # tests, against both backends at both Term_ID widths.
      - name: Test at both Term_ID widths
        working-directory: odin-rdf-sparql
        run: make test
