# Two sibling checkouts: this project reaches the parser and the record store
# through collections, and a collection resolves in the importing compilation,
# so the record's own `rdf:` imports need the parser present here too.
#
# *(Amended 2026-08-25, SPARQL-T-0031: there were three. odin-rdf-store's
# checkout and its pin history are retired below, where the port deleted the
# `store:` collection.)*
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Nothing here links LMDB or any other native code since SPARQL-T-0031:
    # odin-rdf-record is pure Odin and the suites open every store over its
    # platform-free memory seam, so all three runners build and run the same
    # thing. Before the port this job ran wherever odin-rdf-store had a
    # vendored LMDB archive for the platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: odin-rdf-sparql

      # Both are pinned to released tags rather than tracking main, matching
      # odin-rdf-shacl's workflow. Until SPARQL-T-0023 this job checked out
      # whatever was on the upstream default branches, which meant an unrelated
      # upstream commit could turn this repository's CI red and there was no way
      # to tell a local regression from an inherited one. A pin makes an upstream
      # move a deliberate bump here, and a red build then means this repository
      # broke.
      #
      # To bump either of them: change the ref, run `make test` and `make check`
      # locally against the new checkout, and commit them together — a collection
      # is resolved in the *importing* compilation, so the record store's sources
      # are built against whichever parser this file names, and moving one
      # without the other is how two versions of the data model end up in one
      # binary.

      # **odin-rdf-parser `v0.1.2` is a pin with a floor's reason**
      # (2026-08-25). It sat at `v0.1.0` through the whole port, deliberately:
      # `v0.1.1` fixed a scanner position (`RDF-T-0025`) that nothing here
      # asserts, and the family left this repository alone until it was off
      # odin-rdf-store. `v0.1.2` is different — it is `RDF-T-0026`, and this
      # repository is what asked for it. Below it, `resolve()` runs an
      # *absolute* IRI through RFC 3986 §5.2 reference resolution and strips
      # its dot segments, base or no base, so a Turtle document loads a term
      # it does not contain. `sparql10-i18n/normalization-02` stores
      # `eXAMPLE://a/./b/../b/%63/%7bfoo%7d#xyz` and asks for it byte for
      # byte; `test_eval_sparql10_i18n` is enabled and fails at any earlier
      # ref. The engine's own query parser was always correct, so nothing in
      # `sparql/` moved for this — only what the loader hands it.
      #
      # `RDF-T-0025` comes along for the ride, and this repository still does
      # not assert it: `sparql/scanner.odin`'s `scan_long_string` carries a
      # line-for-line copy of the same defect, unfiled here as of this bump.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-parser
          ref: v0.1.2
          path: odin-rdf-parser

      # **odin-rdf-store's checkout was here and is retired**
      # (SPARQL-T-0031, 2026-08-25). It was pinned at `v0.6.0` over a stack
      # of floors this file argued at length: `v0.1.1` for STORE-A-0004's
      # five-platform LMDB vendoring, without which `sparql/kvstore` linked
      # on macOS alone; `v0.2.0` for the memstore retirement (STORE-A-0006);
      # `v0.3.0` for the transactional reads SPARQL-T-0024 made a query out
      # of; `v0.5.0` for `txn_begin_as_of` and `remove` (STORE-A-0008); and
      # `v0.6.0` as a pin rather than a floor, so that this repository was
      # what proved that release safe for its consumers. All of it was true
      # and none of it applies: the engine is on odin-rdf-record, the
      # `store:` collection is gone from the Makefile, and odin-rdf-store is
      # to be retired once this port completes. The paragraph stands as the
      # record of what the pin was for.

      # **odin-rdf-record `v0.4.0` is a floor, and it is the only pin here
      # that was cut *for* this repository** (SPARQL-T-0030). The port off
      # odin-rdf-store onto the record store is SPARQL-I-0003; this checkout
      # arrives before anything store-side is deleted, so for the length of
      # that initiative all three siblings are present at once and `store:`
      # above is still load-bearing.
      #
      # The floor is `v0.4.0` and not `v0.3.0`, which is what SPARQL-T-0030
      # was filed asking for, because the gate this port was blocked on landed
      # in between. `v0.3.0` is a floor in its own right for odin-rdf-shacl —
      # `v0.2.0` for `ingest` emitting a document's *set* (RECORD-T-0019),
      # `v0.3.0` for the distinct `Term_ID`/`Fact_ID`/`Epoch` types
      # (RECORD-T-0020), without which an engine holding raw `u32` ids does
      # not compile. Above both, `v0.4.0` is RECORD-I-0004: RDF 1.2 triple
      # terms and base-direction literals, which `apply` refused outright
      # before it. The engine itself names `snapshot_triple_parts`,
      # `Term_Kind.Triple` and `snapshot_term_destroy` since SPARQL-T-0031
      # — `exec_triple_parts`, `unify_shape` and the two ownership paths in
      # `expr_eval.odin` and `query.odin` — so this cannot pin lower and
      # will not become able to; and the 38 evaluated entries of
      # `sparql12-eval-triple-terms` are unreachable below it in any case
      # (SPARQL-I-0003 §6). *(Until SPARQL-T-0031 this argument rested on
      # `tests/smoke`, which is deleted at SPARQL-T-0032; it now rests on
      # the engine, which is not.)*
      #
      # `v0.4.0` is also a **format** break: format version 2 does not read a
      # version 1 log and refuses with `.Bad_Version`. That costs this
      # repository nothing — every store the suite makes is fresh over
      # `Mem_FS` — but it is the reason the bump is a minor rather than a
      # patch — the same reasoning the retired store pin above gave for its
      # own format break.
      #
      # **`v0.5.0` is the pin since 2026-08-27 (SPARQL-T-0045)**, and it is
      # the first record bump that changed this repository's *source* rather
      # than only what it could load: `record.Filter` gained
      # `scope: Graph_Scope` with no valid zero, so a `Filter` that does not
      # state `.All` or `.Set` is refused by `range_iter` at its first read
      # (RECORD-T-0029 — an empty graph set had been reading every graph or
      # nothing by allocation history). Three sites here state `.All`: the
      # two executor read sites and the W3C harness. Not a format change;
      # nothing in the suites notices beyond those three lines.
      # SPARQL-T-0044 is where `.Set` arrives — the application's graph set
      # as a ceiling on what a query may read.
      #
      # **`v0.6.0` is the pin since 2026-08-27 (SPARQL-T-0046)**, and it is
      # the first record bump that changed what this engine *costs* without
      # changing a line of it: record gained a seventh order, `GPOS`
      # (RECORD-T-0028 — the application's workspace design fired
      # RECORD-A-0004's review trigger), and `snapshot_match` chooses it
      # whenever G is bound, S is not, and O is not bound without P. Every
      # graph-bound pattern here becomes a prefix read at this pin;
      # `bench/`'s `graph` case, this repository's own evidence that a
      # bound graph was a scan (RECORD-T-0026), is re-pinned in
      # `bench/config.odin` at exactly its answer. `merge_order_for` also
      # sees the seventh order and selects it when G and P are ground and
      # the join is on O — a correct, narrower window.
      #
      # No `python3` step is needed: the cross-implementation verifier is
      # record's own test-suite dependency, not a consumer's. The Windows
      # runner compiles record without its POSIX `File_Ops` — that file is
      # `#+build linux, darwin` — which works only for as long as nothing
      # here names `posix_file_ops`. Every store this repository opens —
      # the suites, the guards, the W3C harness, `bench/store.odin` — uses
      # `mem_file_ops`, which is platform-free. The README shows
      # `posix_file_ops`, because that is what an application uses; no
      # test does.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-record
          ref: v0.6.0
          path: odin-rdf-record

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Odin version
        run: odin version

      - name: Vet every package
        working-directory: odin-rdf-sparql
        run: make check

      # The W3C suites dominate this one: 352 syntax and 483 evaluation
      # tests. There is no Term_ID width matrix any more (SPARQL-T-0031):
      # odin-rdf-record's widths are fixed because its inline term encoding
      # was frozen at first write, so there is one configuration.
      #
      # **The suite is whole again as of SPARQL-T-0033**: 537 of 537
      # evaluated entries across 38 directories, no skip list and no
      # expected-failure file — 25 more than before the port, because
      # record's language-tag folding closed the one entry that kept
      # `sparql10-expr-builtin` out.
      - name: Test
        working-directory: odin-rdf-sparql
        run: make test
