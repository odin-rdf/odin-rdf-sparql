# Same shape as the store's workflow, with one more sibling checkout: this
# project reaches both the parser and the store through collections, and a
# collection resolves in the importing compilation, so the store's own
# `rdf:` imports need the parser present here too.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '.metis/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # sparql/kvstore compiles the store's LMDB backend into its own
    # binaries, so this repo runs wherever the store has a vendored LMDB
    # archive -- which, since the archives were built out, is everywhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          path: odin-rdf-sparql

      # Both are pinned to released tags rather than tracking main, matching
      # odin-rdf-shacl's workflow. Until SPARQL-T-0023 this job checked out
      # whatever was on the upstream default branches, which meant an unrelated
      # upstream commit could turn this repository's CI red and there was no way
      # to tell a local regression from an inherited one. A pin makes an upstream
      # move a deliberate bump here, and a red build then means this repository
      # broke.
      #
      # **odin-rdf-store v0.3.0 is a floor, not just a pin**, for three reasons,
      # each strictly above the last. `v0.1.0` vendored exactly one LMDB archive
      # — `liblmdb_darwin_arm64.a` — and `sparql/kvstore` links those archives,
      # so against that tag this builds on macOS and fails to link on the ubuntu
      # and windows runners above; STORE-A-0004's five-platform vendoring is what
      # `v0.1.1` released. Above that, `v0.2.0` is the release that retired
      # `store/memstore` (STORE-A-0006), and since SPARQL-T-0023 this repository
      # has no memstore instantiation to build against an earlier store. Above
      # that again, SPARQL-T-0024 made a query one snapshot: `txn_begin`,
      # `match_txn`, `find_term_txn` and `lookup_term_txn` do not exist before
      # `v0.3.0` (STORE-A-0007). Do not pin below it.
      #
      # To bump either: change the ref, run `make test` and `make check` locally
      # against the new checkout, and commit them together — a collection is
      # resolved in the *importing* compilation, so the store's sources are built
      # against whichever parser this file names, and moving one without the
      # other is how two versions of the data model end up in one binary.
      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-parser
          ref: v0.1.0
          path: odin-rdf-parser

      - uses: actions/checkout@v5
        with:
          repository: odin-rdf/odin-rdf-store
          ref: v0.3.0
          path: odin-rdf-store

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Odin version
        run: odin version

      - name: Vet every package
        working-directory: odin-rdf-sparql
        run: make check

      # The W3C suites dominate this one: 352 syntax and 483 evaluation
      # tests, against both backends at both Term_ID widths.
      - name: Test at both Term_ID widths
        working-directory: odin-rdf-sparql
        run: make test
